<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.id == null ? 'Add Product' : 'Edit Product'} + ' - CRUD Store'">Product Form - CRUD Store</title>
</head>
<body>
    <div th:replace="~{layout/main :: body(content=~{::div.content})}">
        <div class="content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 th:text="${product.id == null ? 'Add New Product' : 'Edit Product'}">Product Form</h2>
                <a th:href="@{/admin/products}" class="btn btn-outline-primary">
                    <i class="fas fa-arrow-left me-2"></i> Back to Products
                </a>
            </div>
            
            <div class="card">
                <div class="card-body">
                    <form th:action="@{/admin/products/save}" method="post" enctype="multipart/form-data" th:object="${product}">
                        <input type="hidden" th:field="*{id}">
                        <input type="hidden" th:field="*{imageUrl}">
                        <input type="hidden" th:field="*{createdAt}" th:if="*{createdAt != null}">
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="name" class="form-label">Product Name</label>
                                <input type="text" class="form-control" id="name" th:field="*{name}" required>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label for="category" class="form-label">Category</label>
                                <select class="form-select" id="category" th:field="*{category}" required>
                                    <option value="">Select Category</option>
                                    <option value="Electronics">Electronics</option>
                                    <option value="Clothing">Clothing</option>
                                    <option value="Books">Books</option>
                                    <option value="Home">Home & Kitchen</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="price" class="form-label">Price</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" class="form-control" id="price" th:field="*{price}" step="0.01" min="0" required>
                                </div>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label for="stock" class="form-label">Stock</label>
                                <input type="number" class="form-control" id="stock" th:field="*{stock}" min="0" required>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" th:field="*{description}" rows="5" required></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label for="image" class="form-label">Product Image</label>
                            <input type="file" class="form-control" id="image" name="image" accept="image/*">
                            <div class="form-text" th:if="*{imageUrl != null}">
                                Current image: <span th:text="*{imageUrl}"></span>
                                <img th:src="*{imageUrl}" alt="Current Image" class="img-thumbnail mt-2" style="max-width: 200px;">
                            </div>
                        </div>
                        
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a th:href="@{/admin/products}" class="btn btn-outline-secondary me-md-2">Cancel</a>
                            <button type="submit" class="btn btn-primary">Save Product</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
