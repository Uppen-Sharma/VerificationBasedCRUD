<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Details - CRUD Store</title>
</head>
<body>
    <div th:replace="~{layout/main :: body(content=~{::div.content})}">
        <div class="content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>User Details</h2>
                <a th:href="@{/admin/users}" class="btn btn-outline-primary">
                    <i class="fas fa-arrow-left me-2"></i> Back to Users
                </a>
            </div>
            
            <div class="row">
                <div class="col-lg-4 mb-4">
                    <div class="card">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0">User Information</h5>
                        </div>
                        <div class="card-body">
                            <p><strong>ID:</strong> <span th:text="${user.id}">1</span></p>
                            <p><strong>Name:</strong> <span th:text="${user.name}">User Name</span></p>
                            <p><strong>Email:</strong> <span th:text="${user.email}">user@example.com</span></p>
                            <p><strong>Phone:</strong> <span th:text="${user.phone}">+1234567890</span></p>
                            <p><strong>Address:</strong> <span th:text="${user.address}">Address</span></p>
                            <p>
                                <strong>Role:</strong> 
                                <span th:class="${'badge ' + (user.role == T(com.example.crudstore.model.User.Role).ROLE_ADMIN ? 'bg-danger' : 'bg-primary')}"
                                      th:text="${user.role == T(com.example.crudstore.model.User.Role).ROLE_ADMIN ? 'Admin' : 'User'}">
                                    Role
                                </span>
                            </p>
                            <p>
                                <strong>Status:</strong> 
                                <span th:class="${'badge ' + (user.enabled ? 'bg-success' : 'bg-warning')}"
                                      th:text="${user.enabled ? 'Active' : 'Inactive'}">
                                    Status
                                </span>
                            </p>
                        </div>
                    </div>
                </div>
                
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0">Order History</h5>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-hover">
                                    <thead>
                                        <tr>
                                            <th>Order ID</th>
                                            <th>Date</th>
                                            <th>Total</th>
                                            <th>Status</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="order : ${orders}">
                                            <td th:text="${'#' + order.id}">Order ID</td>
                                            <td th:text="${#temporals.format(order.orderDate, 'dd-MM-yyyy HH:mm')}">Date</td>
                                            <td th:text="${'$' + order.totalAmount}">$299.97</td>
                                            <td>
                                                <span th:class="${'badge ' + 
                                                    (order.status == T(com.example.crudstore.model.Order.OrderStatus).PENDING ? 'bg-warning' : '') + 
                                                    (order.status == T(com.example.crudstore.model.Order.OrderStatus).PROCESSING ? 'bg-info' : '') + 
                                                    (order.status == T(com.example.crudstore.model.Order.OrderStatus).SHIPPED ? 'bg-primary' : '') + 
                                                    (order.status == T(com.example.crudstore.model.Order.OrderStatus).DELIVERED ? 'bg-success' : '') + 
                                                    (order.status == T(com.example.crudstore.model.Order.OrderStatus).CANCELLED ? 'bg-danger' : '')}"
                                                    th:text="${order.status}">
                                                    Status
                                                </span>
                                            </td>
                                            <td>
                                                <a th:href="@{/admin/orders/{id}(id=${order.id})}" class="btn btn-sm btn-outline-primary">
                                                    View
                                                </a>
                                            </td>
                                        </tr>
                                        <tr th:if="${orders.empty}">
                                            <td colspan="5" class="text-center">No orders found</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
