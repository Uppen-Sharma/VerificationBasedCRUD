<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - CRUD Store</title>
</head>
<body>
    <div th:replace="~{layout/main :: body(content=~{::div.content})}">
        <div class="content">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow">
                        <div class="card-body p-5">
                            <h2 class="text-center mb-4">Verify Your Email</h2>
                            <p class="text-center mb-4">We've sent a 6-digit verification code to <strong th:text="${email}">your email</strong>.</p>
                            
                            <form th:action="@{/verify-otp}" method="post">
                                <input type="hidden" name="email" th:value="${email}">
                                
                                <div class="mb-4">
                                    <label for="otp" class="form-label">Enter OTP</label>
                                    <input type="text" class="form-control form-control-lg text-center" id="otp" name="otp" 
                                           maxlength="6" placeholder="------" required>
                                </div>
                                
                                <div class="d-grid mb-3">
                                    <button type="submit" class="btn btn-primary btn-lg">Verify</button>
                                </div>
                            </form>
                            
                            <div class="text-center">
                                <p>Didn't receive the code?</p>
                                <form th:action="@{/resend-otp}" method="post">
                                    <input type="hidden" name="email" th:value="${email}">
                                    <button type="submit" class="btn btn-link">Resend OTP</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
