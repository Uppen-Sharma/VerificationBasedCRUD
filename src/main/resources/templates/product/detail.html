<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.name} + ' - CRUD Store'">Product - CRUD Store</title>
</head>
<body>
    <div th:replace="~{layout/main :: body(content=~{::div.content})}">
        <div class="content">
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/category(name=${product.category})}" th:text="${product.category}">Category</a></li>
                    <li class="breadcrumb-item active" aria-current="page" th:text="${product.name}">Product</li>
                </ol>
            </nav>
            
            <div class="row">
                <div class="col-md-5 mb-4">
                    <img th:src="${product.imageUrl != null ? product.imageUrl : '/images/placeholder.png'}" 
                         class="img-fluid rounded" alt="Product Image">
                </div>
                
                <div class="col-md-7">
                    <h2 th:text="${product.name}">Product Name</h2>
                    <p class="text-primary h3 mb-4" th:text="${'$' + product.price}">$99.99</p>
                    
                    <div class="mb-4">
                        <h5>Description</h5>
                        <p th:text="${product.description}">Product description goes here.</p>
                    </div>
                    
                    <div class="mb-4">
                        <h5>Availability</h5>
                        <p th:if="${product.stock > 0}" class="text-success">
                            <i class="fas fa-check-circle"></i> In Stock (<span th:text="${product.stock}">10</span> available)
                        </p>
                        <p th:unless="${product.stock > 0}" class="text-danger">
                            <i class="fas fa-times-circle"></i> Out of Stock
                        </p>
                    </div>
                    
                    <div sec:authorize="isAuthenticated()" th:if="${product.stock > 0}">
                        <form th:action="@{/cart/add}" method="post">
                            <input type="hidden" name="productId" th:value="${product.id}">
                            
                            <div class="row g-3 align-items-center mb-4">
                                <div class="col-auto">
                                    <label for="quantity" class="col-form-label">Quantity:</label>
                                </div>
                                <div class="col-auto">
                                    <input type="number" id="quantity" name="quantity" class="form-control" 
                                           min="1" th:max="${product.stock}" value="1">
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-cart-plus me-2"></i> Add to Cart
                            </button>
                        </form>
                    </div>
                    
                    <div sec:authorize="!isAuthenticated()" class="mt-3">
                        <a th:href="@{/login}" class="btn btn-outline-primary">
                            <i class="fas fa-sign-in-alt me-2"></i> Login to Purchase
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
