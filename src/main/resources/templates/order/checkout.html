<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - CRUD Store</title>
</head>
<body>
    <div th:replace="~{layout/main :: body(content=~{::div.content})}">
        <div class="content">
            <h2 class="mb-4">Checkout</h2>
            
            <div class="row">
                <div class="col-lg-8">
                    <div class="card mb-4">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0">Shipping Information</h5>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/place-order}" method="post">
                                <div class="mb-3">
                                    <label for="name" class="form-label">Full Name</label>
                                    <input type="text" class="form-control" id="name" th:value="${user.name}" readonly>
                                </div>
                                
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="email" class="form-label">Email</label>
                                        <input type="email" class="form-control" id="email" th:value="${user.email}" readonly>
                                    </div>
                                    
                                    <div class="col-md-6 mb-3">
                                        <label for="phone" class="form-label">Phone</label>
                                        <input type="tel" class="form-control" id="phone" th:value="${user.phone}" readonly>
                                    </div>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="shippingAddress" class="form-label">Shipping Address</label>
                                    <textarea class="form-control" id="shippingAddress" name="shippingAddress" rows="3" 
                                              th:text="${user.address}" required></textarea>
                                    <div class="form-text">You can edit the shipping address if needed.</div>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="paymentMethod" class="form-label">Payment Method</label>
                                    <select class="form-select" id="paymentMethod" required>
                                        <option value="cod" selected>Cash on Delivery</option>
                                        <option value="card">Credit/Debit Card</option>
                                        <option value="paypal">PayPal</option>
                                    </select>
                                </div>
                                
                                <button type="submit" class="btn btn-primary">
                                    Place Order <i class="fas fa-check ms-2"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
                
                <div class="col-lg-4">
                    <div class="card">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0">Order Summary</h5>
                        </div>
                        <div class="card-body">
                            <div th:each="item : ${cart.items}" class="d-flex justify-content-between mb-2">
                                <span>
                                    <span th:text="${item.quantity}">1</span> x 
                                    <span th:text="${item.product.name}">Product</span>
                                </span>
                                <span th:text="${'$' + item.product.price * item.quantity}">$99.99</span>
                            </div>
                            
                            <hr>
                            
                            <div class="d-flex justify-content-between mb-2">
                                <span>Subtotal:</span>
                                <span th:text="${'$' + cart.totalPrice}">$299.97</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Shipping:</span>
                                <span>Free</span>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between">
                                <strong>Total:</strong>
                                <strong th:text="${'$' + cart.totalPrice}">$299.97</strong>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
