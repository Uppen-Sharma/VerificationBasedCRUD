<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History - CRUD Store</title>
</head>
<body>
    <div th:replace="~{layout/main :: body(content=~{::div.content})}">
        <div class="content">
            <h2 class="mb-4">My Orders</h2>
            
            <div th:if="${orders.empty}" class="text-center py-5">
                <i class="fas fa-shopping-bag fa-4x text-muted mb-3"></i>
                <h3>No orders yet</h3>
                <p class="mb-4">You haven't placed any orders yet.</p>
                <a th:href="@{/}" class="btn btn-primary">Start Shopping</a>
            </div>
            
            <div th:unless="${orders.empty}" class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Order ID</th>
                                    <th>Date</th>
                                    <th>Total</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="order : ${orders}">
                                    <td th:text="${'#' + order.id}">Order ID</td>
                                    <td th:text="${#temporals.format(order.orderDate, 'dd-MM-yyyy HH:mm')}">Date</td>
                                    <td th:text="${'$' + order.totalAmount}">$299.97</td>
                                    <td>
                                        <span th:class="${'badge ' + 
                                            (order.status == T(com.example.crudstore.model.Order.OrderStatus).PENDING ? 'bg-warning' : '') + 
                                            (order.status == T(com.example.crudstore.model.Order.OrderStatus).PROCESSING ? 'bg-info' : '') + 
                                            (order.status == T(com.example.crudstore.model.Order.OrderStatus).SHIPPED ? 'bg-primary' : '') + 
                                            (order.status == T(com.example.crudstore.model.Order.OrderStatus).DELIVERED ? 'bg-success' : '') + 
                                            (order.status == T(com.example.crudstore.model.Order.OrderStatus).CANCELLED ? 'bg-danger' : '')}"
                                            th:text="${order.status}">
                                            Status
                                        </span>
                                    </td>
                                    <td>
                                        <a th:href="@{/order/{id}(id=${order.id})}" class="btn btn-sm btn-outline-primary">
                                            View Details
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
