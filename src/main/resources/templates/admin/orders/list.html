<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders - CRUD Store</title>
</head>
<body>
    <div th:replace="~{layout/main :: body(content=~{::div.content})}">
        <div class="content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Manage Orders</h2>
                <a th:href="@{/admin}" class="btn btn-outline-primary">
                    <i class="fas fa-arrow-left me-2"></i> Back to Dashboard
                </a>
            </div>
            
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Order ID</th>
                                    <th>Customer</th>
                                    <th>Date</th>
                                    <th>Total</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="order : ${orders}">
                                    <td th:text="${'#' + order.id}">Order ID</td>
                                    <td th:text="${order.user.name}">Customer Name</td>
                                    <td th:text="${#temporals.format(order.orderDate, 'dd-MM-yyyy HH:mm')}">Date</td>
                                    <td th:text="${'$' + order.totalAmount}">$299.97</td>
                                    <td>
                                        <span th:class="${'badge ' + 
                                            (order.status == T(com.example.crudstore.model.Order.OrderStatus).PENDING ? 'bg-warning' : '') + 
                                            (order.status == T(com.example.crudstore.model.Order.OrderStatus).PROCESSING ? 'bg-info' : '') + 
                                            (order.status == T(com.example.crudstore.model.Order.OrderStatus).SHIPPED ? 'bg-primary' : '') + 
                                            (order.status == T(com.example.crudstore.model.Order.OrderStatus).DELIVERED ? 'bg-success' : '') + 
                                            (order.status == T(com.example.crudstore.model.Order.OrderStatus).CANCELLED ? 'bg-danger' : '')}"
                                            th:text="${order.status}">
                                            Status
                                        </span>
                                    </td>
                                    <td>
                                        <a th:href="@{/admin/orders/{id}(id=${order.id})}" class="btn btn-sm btn-outline-primary">
                                            View Details
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${orders.empty}">
                                    <td colspan="6" class="text-center">No orders found</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
