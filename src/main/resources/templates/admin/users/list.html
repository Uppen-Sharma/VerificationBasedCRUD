<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - CRUD Store</title>
</head>
<body>
    <div th:replace="~{layout/main :: body(content=~{::div.content})}">
        <div class="content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Manage Users</h2>
                <a th:href="@{/admin}" class="btn btn-outline-primary">
                    <i class="fas fa-arrow-left me-2"></i> Back to Dashboard
                </a>
            </div>
            
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="user : ${users}">
                                    <td th:text="${user.id}">1</td>
                                    <td th:text="${user.name}">User Name</td>
                                    <td th:text="${user.email}">user@example.com</td>
                                    <td>
                                        <span th:class="${'badge ' + (user.role == T(com.example.crudstore.model.User.Role).ROLE_ADMIN ? 'bg-danger' : 'bg-primary')}"
                                              th:text="${user.role == T(com.example.crudstore.model.User.Role).ROLE_ADMIN ? 'Admin' : 'User'}">
                                            Role
                                        </span>
                                    </td>
                                    <td>
                                        <span th:class="${'badge ' + (user.enabled ? 'bg-success' : 'bg-warning')}"
                                              th:text="${user.enabled ? 'Active' : 'Inactive'}">
                                            Status
                                        </span>
                                    </td>
                                    <td>
                                        <a th:href="@{/admin/users/{id}(id=${user.id})}" class="btn btn-sm btn-outline-primary">
                                            View Details
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${users.empty}">
                                    <td colspan="6" class="text-center">No users found</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
